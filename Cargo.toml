[package]
name = "time-capsule"
version = "0.1.0"
edition = "2021"

[dependencies]
## server
tokio = { version = "1", features = ['full'] }
axum = "0.8.3"

## serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

## database
mongodb = "3.2.3"

## dotenv
dotenvy = "0.15.7"

## datetime
chrono = { version = "0.4.40", features = ["serde"] }

## request validation
validator = { version = "0.20.0", features = ["derive"] }

## misc
nanoid = "0.4.0"
futures = "0.3"